<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadHunter — Create Account</title>
  <link rel="icon" type="image/x-icon" href="/vite.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="styles.css">

  <!-- Auto-redirect if already logged in -->
  <script>
    fetch('/api/me').then(async res => {
      if (res.ok) {
        const user = await res.json();
        const urlParams = new URLSearchParams(window.location.search);
        const requestedPlan = urlParams.get('plan');
        if (requestedPlan) {
          window.location.replace(`/api/checkout/session?plan=${requestedPlan}`);
        } else {
          const isTrialValid = user.trialEndsAt && new Date(user.trialEndsAt) > new Date();
          if (user.subscriptionPlan === 'expired' || user.subscriptionPlan === 'none' || (user.subscriptionPlan === 'free' && !isTrialValid)) {
            window.location.replace('/expired.html');
          } else {
            window.location.replace('/dashboard.html');
          }
        }
      }
    }).catch(() => { });
  </script>
</head>

<body
  class="bg-obsidian-950 flex items-center justify-center min-h-screen text-slate-100 font-sans antialiased relative overflow-hidden selection:bg-cyan-500/30 selection:text-cyan-200">
  
  <!-- Ambient background glow mesh -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div class="absolute top-[-10%] left-[-10%] w-[38rem] h-[38rem] bg-sky-500/10 rounded-full blur-[140px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[34rem] h-[34rem] bg-indigo-500/10 rounded-full blur-[140px]"></div>
    <div class="absolute top-[40%] left-[30%] w-[24rem] h-[24rem] bg-emerald-500/05 rounded-full blur-[120px]"></div>
  </div>

  <div class="w-full max-w-[440px] p-6 relative z-10">
    <!-- Header Logo -->
    <div class="flex items-center gap-3 justify-center mb-8">
      <div class="w-12 h-12 rounded-2xl overflow-hidden flex items-center justify-center shrink-0 border border-white/10 bg-slate-900/80 shadow-glow">
        <img src="/vite.ico" alt="Logo" class="w-7 h-7 object-contain" />
      </div>
      <span class="text-2xl font-display font-bold text-white tracking-tight">LeadHunter</span>
    </div>

    <!-- Outer double-bezel wrapper -->
    <div class="double-bezel">
      <div class="double-bezel-inner">
        <div class="text-center mb-8">
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-[10px] font-bold uppercase tracking-[0.2em] text-emerald-400 mb-4">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            3-Day Free Enterprise Access
          </div>
          <h1 class="text-2xl font-display font-bold text-white tracking-tight mb-1.5">Create Account</h1>
          <p class="text-xs text-slate-400 font-medium">Join the automated B2B outreach engine</p>
        </div>

        <form id="signupForm" class="space-y-5">
          <div>
            <label for="username"
              class="block text-[11px] font-bold text-slate-300 mb-2 tracking-wider uppercase">Username</label>
            <input type="text" id="username" name="username"
              class="w-full px-4 py-3 bg-slate-900/80 border border-white/10 rounded-xl text-sm text-slate-100 font-mono placeholder:text-slate-500 focus:bg-slate-900 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all duration-200"
              placeholder="johndoe" required autocomplete="username" />
          </div>

          <div>
            <label for="email"
              class="block text-[11px] font-bold text-slate-300 mb-2 tracking-wider uppercase">Email Address</label>
            <input type="email" id="email" name="email"
              class="w-full px-4 py-3 bg-slate-900/80 border border-white/10 rounded-xl text-sm text-slate-100 font-mono placeholder:text-slate-500 focus:bg-slate-900 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all duration-200"
              placeholder="john@company.com" required autocomplete="email" />
          </div>

          <div>
            <label for="password"
              class="block text-[11px] font-bold text-slate-300 mb-2 tracking-wider uppercase">Password</label>
            <div class="relative">
              <input type="password" id="password" name="password"
                class="w-full px-4 py-3 bg-slate-900/80 border border-white/10 rounded-xl text-sm text-slate-100 font-mono placeholder:text-slate-500 focus:bg-slate-900 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all duration-200 pr-12"
                placeholder="••••••••" required autocomplete="new-password" />
              <button type="button" id="togglePassword"
                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-emerald-400 cursor-pointer transition-colors duration-200">
                <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="hidden">
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                  </path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
                <svg id="eyeOnIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit"
            class="w-full py-3.5 mt-2 bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 hover:brightness-110 text-white rounded-xl text-xs font-bold tracking-[0.18em] uppercase transition-all duration-300 flex items-center justify-center shadow-glow-emerald hover:-translate-y-0.5 cursor-pointer active:scale-[0.99]">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round" class="mr-2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <line x1="19" y1="8" x2="19" y2="14"></line>
              <line x1="22" y1="11" x2="16" y2="11"></line>
            </svg>
            Sign Up
          </button>
        </form>

        <div id="error"
          class="hidden mt-5 p-4 bg-rose-950/40 border border-rose-500/30 rounded-xl text-rose-300 text-xs font-medium backdrop-blur-md">
        </div>

        <div class="mt-6 pt-5 border-t border-white/05 text-center text-xs text-slate-400 font-medium">
          Already have an account? <a href="/login.html" class="text-emerald-400 font-bold hover:underline ml-1">Sign in</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById("togglePassword");
    const pwdInput = document.getElementById("password");
    const eyeOn = document.getElementById("eyeOnIcon");
    const eyeOff = document.getElementById("eyeOffIcon");

    toggleBtn.addEventListener('click', () => {
      const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
      pwdInput.setAttribute('type', type);
      eyeOn.classList.toggle('hidden');
      eyeOff.classList.toggle('hidden');
    });

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Processing...';

      const username = e.target.username.value;
      const email = e.target.email.value;
      const password = e.target.password.value;
      const errorDiv = document.getElementById("error");

      errorDiv.classList.add('hidden');
      errorDiv.textContent = '';

      try {
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password })
        });

        if (response.ok) {
          const urlParams = new URLSearchParams(window.location.search);
          const requestedPlan = urlParams.get('plan');

          if (requestedPlan) {
            window.location.href = `/api/checkout/session?plan=${requestedPlan}`;
          } else {
            window.location.href = "/dashboard.html";
          }
        } else {
          const result = await response.json();
          errorDiv.innerHTML = `<strong>Registration Failed</strong><br/>${result.error || "Please try again."}`;
          errorDiv.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round" class="mr-2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <line x1="19" y1="8" x2="19" y2="14"></line>
              <line x1="22" y1="11" x2="16" y2="11"></line>
            </svg>
            Sign Up
          `;
        }
      } catch (error) {
        errorDiv.innerHTML = `<strong>Network Error</strong><br/>Secure connection lost.`;
        errorDiv.classList.remove('hidden');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
