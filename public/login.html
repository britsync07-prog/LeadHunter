<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadHunter — Login</title>
  <link rel="icon" type="image/x-icon" href="/vite.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>

  <!-- Auto-redirect if already logged in -->
  <script>
    fetch('/api/me').then(async res => {
      if (res.ok) {
        const user = await res.json();
        const isTrialValid = user.trialEndsAt && new Date(user.trialEndsAt) > new Date();
        if (user.subscriptionPlan === 'expired' || user.subscriptionPlan === 'none' || (user.subscriptionPlan === 'free' && !isTrialValid)) {
          window.location.replace('/expired.html');
        } else {
          window.location.replace('/dashboard.html');
        }
      }
    }).catch(() => { });
  </script>
</head>

<body
  class="bg-brand-base flex items-center justify-center min-h-screen text-brand-text font-sans antialiased relative overflow-hidden">
  <div class="absolute inset-0 bg-gradient-mesh opacity-90"></div>
  <div class="absolute inset-0 opacity-30" style="background-image:linear-gradient(rgba(16,33,43,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(16,33,43,0.05) 1px, transparent 1px); background-size:26px 26px;"></div>
  <div class="absolute top-[-8%] left-[-4%] w-[32rem] h-[32rem] bg-brand-primary/20 rounded-full blur-[120px]"></div>
  <div class="absolute bottom-[-8%] right-[-2%] w-[26rem] h-[26rem] bg-brand-cta/25 rounded-full blur-[110px]"></div>

  <div class="w-full max-w-[420px] p-6 relative z-10">
    <div class="flex items-center gap-3 justify-center mb-10 text-3xl font-display font-bold text-brand-text tracking-tight">
      <div class="w-11 h-11 rounded-2xl overflow-hidden flex items-center justify-center shrink-0 shadow-glass border border-white/70 ring-1 ring-brand-border/60">
        <img src="/vite.ico" alt="Logo" class="w-full h-full object-cover" />
      </div>
      LeadHunter
    </div>

    <div
      class="bg-white/76 backdrop-blur-2xl border border-white/50 rounded-[28px] p-8 shadow-glass ring-1 ring-brand-border/60">
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/70 border border-brand-border/70 text-[11px] font-bold uppercase tracking-[0.22em] text-brand-primary mb-5">Secure Workspace</div>
        <div class="text-3xl font-display font-bold text-brand-text tracking-tight mb-2">Welcome back</div>
        <div class="text-sm font-medium text-brand-secondary">Sign in to your command center</div>
      </div>

      <form id="loginForm">
        <div class="mb-5">
          <label for="username"
            class="block text-xs font-bold text-brand-secondary mb-2 tracking-wide uppercase">Username or Email</label>
          <input type="text" id="username" name="username"
            class="w-full px-4 py-3.5 bg-white/80 border border-brand-border rounded-2xl text-sm text-brand-text font-mono focus:bg-white focus:outline-none focus:border-brand-primary focus:ring-4 focus:ring-brand-primary/10 transition-all duration-300 shadow-inner"
            placeholder="admin or email@example.com" required autocomplete="username" />
        </div>

        <div class="mb-5 relative">
          <label for="password"
            class="block text-xs font-bold text-brand-secondary mb-2 tracking-wide uppercase">Password</label>
          <div class="relative">
            <input type="password" id="password" name="password"
              class="w-full px-4 py-3.5 bg-white/80 border border-brand-border rounded-2xl text-sm text-brand-text font-mono focus:bg-white focus:outline-none focus:border-brand-primary focus:ring-4 focus:ring-brand-primary/10 transition-all duration-300 shadow-inner pr-12"
              placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" id="togglePassword"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-brand-primary cursor-pointer transition-colors duration-200">
              <!-- Eye Off Icon (default hidden) -->
              <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="hidden">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <!-- Eye Icon (default showing) -->
              <svg id="eyeOnIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-2 mt-2 mb-8">
          <input type="checkbox" id="rememberMe" name="rememberMe"
            class="w-4 h-4 rounded-md border-slate-300 bg-white text-brand-primary focus:ring-brand-primary/20 cursor-pointer accent-brand-primary" />
          <label for="rememberMe"
            class="text-sm font-medium text-brand-secondary cursor-pointer hover:text-brand-text transition-colors">Remember
            me for 30 days</label>
        </div>

        <button type="submit"
          class="w-full py-3.5 bg-gradient-to-r from-brand-primary to-brand-cta hover:brightness-105 text-white rounded-2xl text-sm font-bold tracking-[0.18em] uppercase transition-all duration-300 flex items-center justify-center shadow-glow hover:-translate-y-0.5 cursor-pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" class="mr-2.5">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Sign In
        </button>
      </form>
      <div class="mt-4 text-center">
        <button type="button" onclick="openForgotPasswordModal()" class="text-xs font-semibold text-brand-secondary hover:text-brand-primary transition-colors cursor-pointer">Forgot password?</button>
      </div>
      <div id="error"
        class="hidden mt-6 p-4 bg-red-50 border border-red-100 rounded-xl text-red-600 text-sm font-medium shadow-sm">
      </div>
      <div class="mt-6 text-center text-sm font-medium text-brand-secondary">
        Don't have an account? <a href="/signup.html" class="text-brand-primary font-bold hover:underline">Sign up for
          free</a>
      </div>
      <div class="mt-4 pt-4 border-t border-slate-100 text-center text-xs font-semibold text-brand-secondary">
        Need assistance? <a href="https://discord.gg/WYEmRXRbmn" target="_blank" class="text-brand-primary hover:underline">Contact Support</a>
      </div>
    </div>
  </div>

  <!-- ========== FORGOT PASSWORD MODAL ========== -->
  <div id="forgotPasswordModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4" onclick="closeForgotPasswordModal(event)">
    <div class="bg-white/95 backdrop-blur-2xl border border-white/60 rounded-[28px] p-7 shadow-glass ring-1 ring-brand-border/60 w-full max-w-[420px] relative z-10" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between mb-5">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h3 class="text-lg font-display font-bold text-brand-text">Reset Password</h3>
        </div>
        <button type="button" onclick="closeForgotPasswordModal()" class="text-slate-400 hover:text-slate-600 cursor-pointer p-1">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>

      <p class="text-xs text-brand-secondary mb-5 leading-relaxed">
        Enter your registered username or email address and we'll dispatch a secure password reset link to your inbox.
      </p>

      <form id="forgotPasswordForm" onsubmit="submitForgotPassword(event)">
        <div class="mb-4">
          <label for="forgotEmailOrUsername" class="block text-xs font-bold text-brand-secondary mb-2 tracking-wide uppercase">Username or Email</label>
          <input type="text" id="forgotEmailOrUsername" name="emailOrUsername" required
            class="w-full px-4 py-3 bg-white/80 border border-brand-border rounded-xl text-sm text-brand-text font-mono focus:bg-white focus:outline-none focus:border-brand-primary focus:ring-4 focus:ring-brand-primary/10 transition-all shadow-inner"
            placeholder="admin or email@example.com" />
        </div>

        <div id="forgotResultAlert" class="text-xs font-medium hidden p-3 rounded-xl mb-4 leading-relaxed"></div>

        <button type="submit" id="btnForgotSubmit"
          class="w-full py-3 bg-gradient-to-r from-brand-primary to-brand-cta hover:brightness-105 text-white rounded-xl text-xs font-bold tracking-[0.15em] uppercase transition-all shadow-glow cursor-pointer flex items-center justify-center gap-2">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m22 2-7 20-4-9-9-4Z"></path>
            <path d="M22 2 11 13"></path>
          </svg>
          Send Reset Link
        </button>
      </form>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById("togglePassword");
    const pwdInput = document.getElementById("password");
    const eyeOn = document.getElementById("eyeOnIcon");
    const eyeOff = document.getElementById("eyeOffIcon");

    toggleBtn.addEventListener('click', () => {
      const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
      pwdInput.setAttribute('type', type);
      eyeOn.classList.toggle('hidden');
      eyeOff.classList.toggle('hidden');
    });

    function openForgotPasswordModal() {
      const modal = document.getElementById('forgotPasswordModal');
      const alert = document.getElementById('forgotResultAlert');
      if (alert) {
        alert.className = 'text-xs font-medium hidden p-3 rounded-xl mb-4 leading-relaxed';
        alert.textContent = '';
      }
      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }
    }

    function closeForgotPasswordModal(e) {
      if (e && e.target !== e.currentTarget && e.currentTarget !== e.target.closest('#forgotPasswordModal')) return;
      const modal = document.getElementById('forgotPasswordModal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    async function submitForgotPassword(e) {
      e.preventDefault();
      const input = document.getElementById('forgotEmailOrUsername');
      const alert = document.getElementById('forgotResultAlert');
      const btn = document.getElementById('btnForgotSubmit');
      const value = input?.value?.trim();

      if (!value) return;

      if (alert) {
        alert.className = 'text-xs font-medium p-3 rounded-xl mb-4 leading-relaxed bg-blue-50 text-blue-700 border border-blue-200';
        alert.textContent = 'Generating secure reset link and sending email...';
        alert.classList.remove('hidden');
      }

      if (btn) btn.disabled = true;

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emailOrUsername: value })
        });

        const data = await res.json();

        if (res.ok) {
          if (alert) {
            alert.className = 'text-xs font-medium p-3 rounded-xl mb-4 leading-relaxed bg-emerald-50 text-emerald-700 border border-emerald-200';
            alert.textContent = data.message || 'If an account matches that username or email, a reset link has been dispatched to your inbox.';
          }
          if (input) input.value = '';
        } else {
          if (alert) {
            alert.className = 'text-xs font-medium p-3 rounded-xl mb-4 leading-relaxed bg-red-50 text-red-600 border border-red-200';
            alert.textContent = data.error || 'Failed to process request. Please try again.';
          }
        }
      } catch (err) {
        if (alert) {
          alert.className = 'text-xs font-medium p-3 rounded-xl mb-4 leading-relaxed bg-red-50 text-red-600 border border-red-200';
          alert.textContent = 'Network error. Please check your connection and try again.';
        }
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = e.target.username.value;
      const password = e.target.password.value;
      const rememberMe = e.target.rememberMe.checked;
      const errorDiv = document.getElementById("error");

      errorDiv.classList.add('hidden');
      errorDiv.textContent = '';

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, rememberMe })
        });

        if (response.ok) {
          // Verify plan after login
          const meRes = await fetch("/api/me");
          if (meRes.ok) {
            const userData = await meRes.json();
            const isTrialValid = userData.trialEndsAt && new Date(userData.trialEndsAt) > new Date();
            if (userData.subscriptionPlan === 'expired' || userData.subscriptionPlan === 'none' || (userData.subscriptionPlan === 'free' && !isTrialValid)) {
              window.location.href = "/expired.html";
            } else {
              window.location.href = "/dashboard.html";
            }
          } else {
            window.location.href = "/dashboard.html";
          }
        } else {
          const result = await response.json();
          errorDiv.innerHTML = `<strong>Verification Failed</strong><br/>${result.error || "Incorrect credentials."}`;
          errorDiv.classList.remove('hidden');
        }
      } catch (error) {
        errorDiv.innerHTML = `<strong>Network Error</strong><br/>Secure connection lost.`;
        errorDiv.classList.remove('hidden');
      }
    });
  </script>
</body>

</html>
