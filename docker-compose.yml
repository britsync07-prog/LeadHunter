version: '3.8'

services:
  leadhunter:
    build: .
    container_name: leadhunter-production
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUBLIC_URL=https://leadhunter.uk
      - LOG_LEVEL=info
      # - SESSION_SECRET=replace-with-a-long-random-secret
      # - TRACKING_HMAC_SECRET=replace-with-a-long-random-tracking-secret
      # - EXTERNAL_API_KEY=replace-if-you-use-the-external-api
      # - STRIPE_SECRET_KEY=replace-if-billing-is-enabled
      # - STRIPE_WEBHOOK_SECRET=replace-if-billing-is-enabled
    volumes:
      # Persist SQLite databases across container rebuilds
      - ./data:/usr/src/app/data
      # Map the Chrome profile if preserving local cookie sessions
      - ./google-search/browser-state.json:/usr/src/app/google-search/browser-state.json
